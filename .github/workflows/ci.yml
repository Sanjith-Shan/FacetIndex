name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (unit, property, Testcontainers Kafka)
        env:
          FACETINDEX_DOCKER: "1"
        run: ./gradlew build --console=plain
      - name: Smoke run of every strategy against brute force on a generated 100k dataset
        run: |
          ./gradlew installDist --console=plain -q
          export FACETINDEX_DATA="$RUNNER_TEMP/fi"
          FI_HEAP=3g JAVA_HOME="$JAVA_HOME" bash scripts/fi.sh smoke --n 100000 --dir "$RUNNER_TEMP/fi/smoke" --queries 1000
